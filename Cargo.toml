[package]
name = "fst-writer"
version = "0.3.1"
edition = "2024"
rust-version = "1.85.0"
authors = ["Kevin Laeufer <laeufer@cornell.edu>"]
description = "A Rust library for writing waveform traces in the FST format."
repository = "https://github.com/ekiwi/fst-writer"
license = "BSD-3-Clause"
keywords = ["fst", "waveform", "wavedump"]

[dependencies]
lz4_flex = "0.14"
miniz_oxide = "0.9"
thiserror = "2.0"

[dev-dependencies]
wellen = "0.25.6"
# used to read back our files with the reference implementation
fstapi = "0.0.3"
proptest = "1.11"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
debug = 1
